name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The iOS 13 package needs the pre-iOS-14 arm64e ABI, which only a clang 11
  # toolchain produces, so the macOS runner cannot build it. That job runs on
  # Linux with Theos plus the L1ghtmann clang 11 toolchain instead.
  rootful-ios13:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg-dev xz-utils zlib1g-dev \
            libssl-dev make git curl perl file
          curl -fL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Add iPhoneOS13.7 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS13.7.sdk
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS13.7.sdk" "$THEOS/sdks/"

      - name: Install clang 11 iOS toolchain
        run: |
          # The archive contains linux/iphone/..., so it unpacks into toolchain/.
          curl -fL -o /tmp/tc.tar.xz https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -1

      - name: Build rootful
        run: make -C rootful clean package FINALPACKAGE=1 -j1

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp rootful/packages/*.deb artifacts/ 2>/dev/null || true
          echo "=== artifacts ==="; ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-rootful-ios13
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # The other variants are built against the current SDK on macOS.
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $THEOS --depth 1
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VER}.sdk"
          echo "SDK_VERSION=$SDK_VER" >> $GITHUB_ENV
          echo "SDK_PATH=$SDK_PATH" >> $GITHUB_ENV
          echo "SDK setup complete: iPhoneOS${SDK_VER}.sdk"

      - name: Setup roothide Theos
        run: |
          ROOTHIDE_THEOS=${{ github.workspace }}/theos-roothide
          echo "ROOTHIDE_THEOS=$ROOTHIDE_THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/roothide/theos.git $ROOTHIDE_THEOS --depth 1
          mkdir -p "$ROOTHIDE_THEOS/sdks"
          ln -s "$SDK_PATH" "$ROOTHIDE_THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Build rootless / jailed
        run: |
          make -C rootless clean package FINALPACKAGE=1
          make -C jailed clean all

      - name: Build roothide (arm64e)
        run: |
          THEOS=$ROOTHIDE_THEOS $MAKE -C roothide clean package FINALPACKAGE=1
        env:
          MAKE: make

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp rootless/packages/*.deb   artifacts/ 2>/dev/null || true
          cp roothide/packages/*.deb   artifacts/ 2>/dev/null || true
          cp jailed/PleaseDontStopTheMusic.dylib artifacts/PleaseDontStopTheMusic_jailed.dylib 2>/dev/null || true
          echo "=== artifacts ==="; ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-other
          path: artifacts/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
